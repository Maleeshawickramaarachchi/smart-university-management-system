<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Student Form | Smart University System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 th:text="${student.id == null}
                ? 'Add Student'
                : 'Edit Student'">
            </h3>

        </div>


        <div class="card-body">

            <form th:action="${student.id == null}
                    ? @{/students}
                    : @{/students/update}"
                  th:object="${student}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">


                <!-- Name -->
                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>

                </div>


                <!-- Phone -->
                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input type="text"
                           th:field="*{phone}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}">
                    </div>

                </div>


                <!-- Course -->
                <div class="mb-3">

                    <label class="form-label">
                        Course
                    </label>

                    <input type="text"
                           th:field="*{course}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('course')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('course')}"
                         th:errors="*{course}">
                    </div>

                </div>


                <!-- Buttons -->
                <button type="submit"
                        class="btn btn-success"
                        th:text="${student.id == null}
                            ? 'Save Student'
                            : 'Update Student'">
                </button>


                <a href="/students"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>

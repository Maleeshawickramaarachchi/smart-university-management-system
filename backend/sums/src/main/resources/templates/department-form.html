<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Department | Smart University System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">

</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content -->
        <div class="col-md-10 content">

            <div class="card shadow">

                <!-- Header -->
                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0"
                        th:text="${department.id == null}
                        ? 'Add Department'
                        : 'Edit Department'">

                        Add Department

                    </h4>

                </div>

                <div class="card-body">

                    <form
                        th:action="${department.id == null}
                        ? @{/departments}
                        : @{/departments/update/{id}(id=${department.id})}"
                        th:object="${department}"
                        method="post">

                        <!-- Hidden ID -->
                        <input type="hidden"
                               th:field="*{id}">


                        <!-- Department Code -->
                        <div class="mb-3">

                            <label class="form-label">
                                Department Code
                            </label>

                            <input type="text"
                                   th:field="*{departmentCode}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('departmentCode')} ? 'is-invalid' : ''"
                                   placeholder="Enter department code">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('departmentCode')}"
                                 th:errors="*{departmentCode}">
                            </div>

                        </div>


                        <!-- Department Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Department Name
                            </label>

                            <input type="text"
                                   th:field="*{departmentName}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('departmentName')} ? 'is-invalid' : ''"
                                   placeholder="Enter department name">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('departmentName')}"
                                 th:errors="*{departmentName}">
                            </div>

                        </div>


                        <!-- Description -->
                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                th:field="*{description}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                rows="4"
                                placeholder="Enter department description">
                            </textarea>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}">
                            </div>

                        </div>


                        <!-- Buttons -->
                        <button type="submit"
                                class="btn btn-success">

                            <i class="bi bi-check-circle"></i>

                            <span
                                th:text="${department.id == null}
                                ? 'Save Department'
                                : 'Update Department'">

                                Save Department

                            </span>

                        </button>


                        <a href="/departments"
                           class="btn btn-secondary">

                            <i class="bi bi-x-circle"></i>
                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enrollments | Smart University System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Dashboard CSS -->
    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">

</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>


        <!-- Main Content -->
        <div class="col-md-10 content">

            <h2 class="mb-4">
                Enrollment Management
            </h2>


            <div class="card shadow">

                <!-- Card Header -->
                <div class="card-header bg-primary text-white
                            d-flex justify-content-between align-items-center">

                    <h5 class="mb-0">

                        <i class="bi bi-journal-check"></i>
                        Enrollment List

                    </h5>


                    <a href="/enrollments/new"
                       class="btn btn-light btn-sm">

                        <i class="bi bi-plus-circle"></i>
                        Add Enrollment

                    </a>

                </div>


                <div class="card-body">


                    <!-- Search -->
                    <form th:action="@{/enrollments}"
                          method="get"
                          class="row g-2 mb-4">

                        <div class="col-md-5">

                            <input type="text"
                                   name="keyword"
                                   th:value="${keyword}"
                                   class="form-control"
                                   placeholder="Search by student name">

                        </div>


                        <div class="col-auto">

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-search"></i>
                                Search

                            </button>


                            <a href="/enrollments"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-clockwise"></i>
                                Reset

                            </a>

                        </div>

                    </form>


                    <!-- Enrollment Table -->
                    <div class="table-responsive">

                        <table class="table table-bordered table-hover align-middle">

                            <thead class="table-dark">

                            <tr>

                                <th>No.</th>
                                <th>Student Name</th>
                                <th>Course Name</th>
                                <th>Enrollment Date</th>
                                <th>Status</th>
                                <th>Actions</th>

                            </tr>

                            </thead>


                            <tbody>

                            <tr th:each="enrollment, stat : ${enrollments}">

                                <!-- Number -->
                                <td th:text="${currentPage * 5 + stat.count}">
                                    1
                                </td>


                                <!-- Student -->
                                <td th:text="${enrollment.studentName}">
                                    Student Name
                                </td>


                                <!-- Course -->
                                <td th:text="${enrollment.courseName}">
                                    Course Name
                                </td>


                                <!-- Date -->
                                <td th:text="${enrollment.enrollmentDate}">
                                    2026-08-11
                                </td>


                                <!-- Status -->
                                <td>

                                    <span th:text="${enrollment.status}"
      class="badge"
      th:classappend="${enrollment.status == 'Active'} ? ' bg-success' :
                      (${enrollment.status == 'Completed'} ? ' bg-primary' : ' bg-danger')">
    Active
</span>

                                </td>


                                <!-- Actions -->
                                <td>

                                    <a th:href="@{/enrollments/edit/{id}(id=${enrollment.id})}"
                                       class="btn btn-warning btn-sm">

                                        <i class="bi bi-pencil-square"></i>
                                        Edit

                                    </a>


                                    <a th:href="@{/enrollments/delete/{id}(id=${enrollment.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this enrollment?');">

                                        <i class="bi bi-trash"></i>
                                        Delete

                                    </a>

                                </td>

                            </tr>


                            <!-- No Enrollments -->
                            <tr th:if="${#lists.isEmpty(enrollments)}">

                                <td colspan="6"
                                    class="text-center text-muted">

                                    <i class="bi bi-info-circle"></i>

                                    No enrollments found.

                                </td>

                            </tr>


                            </tbody>

                        </table>

                    </div>


                    <!-- Pagination -->
                    <nav class="mt-4"
                         th:if="${totalPages > 0}">

                        <ul class="pagination justify-content-center">


                            <!-- Previous -->
                            <li class="page-item"
                                th:classappend="${currentPage == 0} ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/enrollments(page=${currentPage - 1},keyword=${keyword})}">

                                    Previous

                                </a>

                            </li>


                            <!-- Page Numbers -->
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${currentPage == i} ? 'active'">

                                <a class="page-link"
                                   th:text="${i + 1}"
                                   th:href="@{/enrollments(page=${i},keyword=${keyword})}">

                                    1

                                </a>

                            </li>


                            <!-- Next -->
                            <li class="page-item"
                                th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/enrollments(page=${currentPage + 1},keyword=${keyword})}">

                                    Next

                                </a>

                            </li>

                        </ul>

                    </nav>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

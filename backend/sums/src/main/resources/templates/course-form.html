<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Form | Smart University System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 th:text="${course.id == null} ? 'Add Course' : 'Edit Course'">
                    </h3>

                </div>

                <div class="card-body">

                    <form th:action="${course.id == null} ? @{/courses} : @{/courses/update}"
                          th:object="${course}"
                          method="post">

                        <input type="hidden" th:field="*{id}">


                        <!-- Course Code -->
                        <div class="mb-3">

                            <label class="form-label">
                                Course Code
                            </label>

                            <input type="text"
                                   th:field="*{courseCode}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid' : ''"
                                   placeholder="IT1010">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('courseCode')}"
                                 th:errors="*{courseCode}">
                            </div>

                        </div>


                        <!-- Course Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Course Name
                            </label>

                            <input type="text"
                                   th:field="*{courseName}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('courseName')} ? 'is-invalid' : ''"
                                   placeholder="Programming Fundamentals">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('courseName')}"
                                 th:errors="*{courseName}">
                            </div>

                        </div>


                        <!-- Credits -->
                        <div class="mb-3">

                            <label class="form-label">
                                Credits
                            </label>

                            <input type="number"
                                   th:field="*{credits}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('credits')} ? 'is-invalid' : ''"
                                   min="1"
                                   max="10">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('credits')}"
                                 th:errors="*{credits}">
                            </div>

                        </div>


                        <!-- Department -->
                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <input type="text"
                                   th:field="*{department}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('department')} ? 'is-invalid' : ''"
                                   placeholder="Information Technology">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('department')}"
                                 th:errors="*{department}">
                            </div>

                        </div>


                        <!-- Buttons -->
                        <button type="submit"
                                class="btn btn-success"
                                th:text="${course.id == null} ? 'Save Course' : 'Update Course'">
                        </button>

                        <a href="/courses"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lecturer Form | Smart University System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 th:text="${lecturer.id == null} ? 'Add Lecturer' : 'Edit Lecturer'">
            </h3>
        </div>

        <div class="card-body">

            <form th:action="${lecturer.id == null} ? @{/lecturers} : @{/lecturers/update}"
                  th:object="${lecturer}"
                  method="post">

                <input type="hidden" th:field="*{id}">


                <!-- Name -->
                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>

                </div>


                <!-- Phone -->
                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input type="text"
                           th:field="*{phone}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}">
                    </div>

                </div>


                <!-- Department -->
                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input type="text"
                           th:field="*{department}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('department')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('department')}"
                         th:errors="*{department}">
                    </div>

                </div>


                <!-- Buttons -->
                <button type="submit"
                        class="btn btn-success"
                        th:text="${lecturer.id == null} ? 'Save Lecturer' : 'Update Lecturer'">
                </button>

                <a href="/lecturers"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>

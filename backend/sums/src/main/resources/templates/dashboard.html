<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Smart University System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">

            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <div class="col-md-10 content">

                <h2 class="mb-4">Dashboard</h2>

                <!-- Stat Cards -->
                <div class="row g-4">

                    <div class="col-md-3">
                        <div class="dashboard-card">
                            <i class="bi bi-mortarboard-fill"></i>
                            <h5>Total Students</h5>
                            <h2 th:text="${studentCount}">0</h2>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="dashboard-card">
                            <i class="bi bi-journal-bookmark-fill"></i>
                            <h5>Total Courses</h5>
                            <h2 th:text="${courseCount}">0</h2>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="dashboard-card">
                            <i class="bi bi-person-workspace"></i>
                            <h5>Total Lecturers</h5>
                            <h2 th:text="${lecturerCount}">0</h2>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="dashboard-card">
                            <i class="bi bi-building"></i>
                            <h5>Departments</h5>
                            <h2 th:text="${departmentCount}">0</h2>
                        </div>
                    </div>

                </div>

                <!-- Welcome Section with Glassmorphism Card -->
                <div class="welcome">
                    <h3>Welcome to Smart University System</h3>
                    <p>Manage Students, Courses, Lecturers, Departments, and Enrollments from one centralized dashboard.</p>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
